<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bartender Flashcards – Nhận Diện Rượu & Kiến Thức Quầy Bar</title>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #1a1d27;
      --card-back: #222634;
      --gold: #d4af37;
      --gold-light: #f3d478;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --green: #22c55e;
      --amber: #f59e0b;
      --border: rgba(212, 175, 55, 0.28);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e2230 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }
    header {
      text-align: center;
      max-width: 820px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.75rem;
      color: var(--gold-light);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 880px;
      margin-bottom: 18px;
    }
    .filter-btn {
      background: rgba(255,255,255,0.05);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--gold);
      color: #111;
      border-color: var(--gold);
      font-weight: 600;
    }
    .stats-bar {
      display: flex;
      gap: 20px;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 16px;
      align-items: center;
    }
    .stats-bar span b { color: var(--gold-light); }
    .scene {
      width: 100%;
      max-width: 720px;
      height: 470px;
      perspective: 1200px;
      margin-bottom: 20px;
    }
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
      cursor: pointer;
    }
    .card.is-flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 26px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 18px 40px rgba(0,0,0,0.45);
      overflow-y: auto;
    }
    .card-front {
      background: linear-gradient(145deg, var(--card-bg), #141720);
    }
    .card-back {
      background: linear-gradient(145deg, var(--card-back), #171b26);
      transform: rotateY(180deg);
      border-color: var(--gold);
    }
    .badge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .card-body {
      my: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
      flex: 1;
      padding: 10px 0;
    }
    .bottle-img {
      max-height: 210px;
      max-width: 240px;
      object-fit: contain;
      border-radius: 10px;
      background: #fff;
      padding: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    }
    .question-text {
      font-size: 1.22rem;
      line-height: 1.5;
      font-weight: 600;
    }
    .answer-title {
      font-size: 1.3rem;
      color: var(--gold-light);
      font-weight: 700;
      margin-bottom: 6px;
    }
    .answer-text {
      font-size: 1.02rem;
      line-height: 1.6;
      text-align: left;
      width: 100%;
    }
    .answer-text ul {
      padding-left: 20px;
      margin-top: 6px;
    }
    .answer-text li {
      margin-bottom: 6px;
    }
    .hint {
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 720px;
    }
    .btn {
      background: #262b3c;
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.14);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.18s;
    }
    .btn:hover { background: #32384e; }
    .btn-green {
      background: rgba(34, 197, 94, 0.18);
      border-color: var(--green);
      color: #86efac;
    }
    .btn-amber {
      background: rgba(245, 158, 11, 0.18);
      border-color: var(--amber);
      color: #fcd34d;
    }
  </style>
</head>
<body>
  <header>
    <h1>🍸 Bartender Flashcards Thực Chiến</h1>
    <p class="subtitle">Nhấp vào thẻ hoặc bấm phím <b>Space</b> để lật thẻ • Phím <b>← / →</b> để chuyển thẻ</p>
  </header>

  <div class="filters" id="filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">Tất cả thẻ</button>
    <button class="filter-btn" onclick="setFilter('visual', this)">📸 Nhận diện chai qua ảnh</button>
    <button class="filter-btn" onclick="setFilter('vodka-gin', this)">Vodka & Gin</button>
    <button class="filter-btn" onclick="setFilter('rum-agave', this)">Rum, Tequila & Mezcal</button>
    <button class="filter-btn" onclick="setFilter('whisky-cognac', this)">Whisky & Cognac</button>
    <button class="filter-btn" onclick="setFilter('liqueur-bar', this)">Liqueur, Cocktail & Phỏng vấn</button>
    <button class="filter-btn" onclick="setFilter('review', this)">📌 Cần ôn lại (<span id="review-count">0</span>)</button>
  </div>

  <div class="stats-bar">
    <span>Thẻ: <b id="card-index">1 / 1</b></span>
    <span>Đã thuộc: <b id="mastered-count">0</b></span>
  </div>

  <div class="scene" onclick="flipCard()">
    <div class="card" id="flashcard">
      <div class="card-face card-front">
        <div class="badge-row">
          <span id="front-cat">CHỦ ĐỀ</span>
          <span id="front-status">CÂU HỎI</span>
        </div>
        <div class="card-body">
          <img id="front-img" class="bottle-img" style="display:none;" alt="Bottle Image" />
          <div class="question-text" id="front-question"></div>
        </div>
        <div class="hint">Nhấp chuột hoặc nhấn phím Space để lật xem đáp án ↻</div>
      </div>
      <div class="card-face card-back">
        <div class="badge-row">
          <span id="back-cat">ĐÁP ÁN CHUẨN BAR</span>
          <span>LẬT LẠI ↺</span>
        </div>
        <div class="card-body">
          <div class="answer-title" id="back-title"></div>
          <div class="answer-text" id="back-answer"></div>
        </div>
        <div class="hint">Đánh dấu "Đã thuộc" hoặc "Cần ôn lại" bên dưới</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" onclick="prevCard()">← Trước</button>
    <button class="btn btn-amber" onclick="markReview()">📌 Cần ôn lại</button>
    <button class="btn btn-green" onclick="markMastered()">✅ Đã thuộc</button>
    <button class="btn" onclick="shuffleCards()">🔀 Trộn thẻ</button>
    <button class="btn" onclick="nextCard()">Tiếp →</button>
  </div>

    let currentFilter = 'all';
    let filteredCards = [...cardsData];
    let currentIndex = 0;
    let mastered = new Set();
    let review = new Set();

    function renderCard() {
      const cardEl = document.getElementById('flashcard');
      cardEl.classList.remove('is-flipped');
      if (filteredCards.length === 0) {
        document.getElementById('front-cat').textContent = 'TRỐNG';
        document.getElementById('front-img').style.display = 'none';
        document.getElementById('front-question').textContent = 'Không có thẻ nào trong mục này!';
        document.getElementById('card-index').textContent = '0 / 0';
        return;
      }
      const item = filteredCards[currentIndex];
      document.getElementById('front-cat').textContent = item.label;
      document.getElementById('back-cat').textContent = item.label;
      document.getElementById('front-status').textContent = mastered.has(item.id) ? '✅ ĐÃ THUỘC' : (review.has(item.id) ? '📌 CẦN ÔN LẠI' : 'CHƯA ĐÁNH DẤU');
      const imgEl = document.getElementById('front-img');
      if (item.img) {
        imgEl.src = item.img;
        imgEl.style.display = 'block';
      } else {
        imgEl.style.display = 'none';
      }
      document.getElementById('front-question').textContent = item.q;
      document.getElementById('back-title').textContent = item.title;
      document.getElementById('back-answer').innerHTML = item.a;
      document.getElementById('card-index').textContent = (currentIndex + 1) + ' / ' + filteredCards.length;
      document.getElementById('mastered-count').textContent = mastered.size + ' / ' + cardsData.length;
      document.getElementById('review-count').textContent = review.size;
    }

    function flipCard() {
      if (filteredCards.length === 0) return;
      document.getElementById('flashcard').classList.toggle('is-flipped');
    }

    function nextCard() {
      if (filteredCards.length === 0) return;
      currentIndex = (currentIndex + 1) % filteredCards.length;
      renderCard();
    }

    function prevCard() {
      if (filteredCards.length === 0) return;
      currentIndex = (currentIndex - 1 + filteredCards.length) % filteredCards.length;
      renderCard();
    }

    function shuffleCards() {
      for (let i = filteredCards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [filteredCards[i], filteredCards[j]] = [filteredCards[j], filteredCards[i]];
      }
      currentIndex = 0;
      renderCard();
    }

    function markMastered() {
      if (filteredCards.length === 0) return;
      const id = filteredCards[currentIndex].id;
      mastered.add(id);
      review.delete(id);
      nextCard();
    }

    function markReview() {
      if (filteredCards.length === 0) return;
      const id = filteredCards[currentIndex].id;
      review.add(id);
      mastered.delete(id);
      nextCard();
    }

    function setFilter(f, btn) {
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      if (f === 'all') filteredCards = [...cardsData];
      else if (f === 'visual') filteredCards = cardsData.filter(c => c.cat === 'visual');
      else if (f === 'review') filteredCards = cardsData.filter(c => review.has(c.id));
      else filteredCards = cardsData.filter(c => c.group === f);
      currentIndex = 0;
      renderCard();
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); flipCard(); }
      else if (e.code === 'ArrowRight') nextCard();
      else if (e.code === 'ArrowLeft') prevCard();
    });

    renderCard();
  </script>
